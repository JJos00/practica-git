name: Ejecutar Pruebas Automatizadas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pytest
        run: pip install pytest

      - name: Pruebas Unitarias
        run: pytest -v test_calculos.py

      - name: Pruebas de Integracion (Try y Except)
        run: pytest -v test_integration.py

      - name: Pruebas de Sistema
        # Error intencional: se coloca system.py en lugar de test_system.py
        run: pytest -v system.py
