apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tienda-api
  template:
    metadata:
      labels:
        app: tienda-api
    spec:
      containers:
      - name: tienda
        image: tienda-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
